name: Deploy GitHub Pages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify committed build artifact
        run: npm run verify:build

      - name: Test
        run: npm test

      - name: Verify zero runtime dependencies
        run: npm run verify:runtime-deps

      - name: Verify runtime source policy
        run: npm run verify:source-policy

      - name: Audit dependencies
        run: npm run audit

      - name: Audit production dependency surface
        run: npm run audit:prod

      - name: Verify npm registry signatures
        run: npm run audit:signatures

      - name: Build
        run: npm run build

      - name: Generate CycloneDX SBOM
        run: npm run --silent sbom > sbom.cdx.json

      - name: Validate SBOM
        run: |
          node -e 'const fs = require("node:fs"); const sbom = JSON.parse(fs.readFileSync("sbom.cdx.json", "utf8")); if (sbom.bomFormat !== "CycloneDX" || !Array.isArray(sbom.components)) throw new Error("Invalid CycloneDX SBOM");'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
